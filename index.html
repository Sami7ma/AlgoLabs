      <h1>AlgoVisuals — Interactive Algorithm Visualizer</h1>
      <p>Explore and visualize algorithms step by step. AlgoVisuals provides interactive simulations for sorting and searching, graph traversal, shortest paths, CPU scheduling, memory allocation, page replacement, dynamic programming, backtracking, and greedy algorithms.</p>
      
      <section>
        <h2>Algorithm Visualizer</h2>
        <p>Comprehensive interactive visual studio covering 20+ essential computer science algorithms with real-time execution metrics and deterministic state stepping.</p>
      </section>

      <section>
        <h2>Operating System Algorithm Visualizer</h2>
        <p>Interactive simulations for Memory Management (First Fit, Best Fit, Worst Fit, Next Fit), CPU Scheduling (Round Robin, FCFS, SJF, Priority), and Virtual Memory Page Replacement (LRU, FIFO, Optimal Bélády).</p>
      </section>

      <section>
        <h2>CPU Scheduling Simulator</h2>
        <p>Interactive Gantt charts, real-time process state timelines, waiting time calculation, and turnaround time metrics for Round Robin (Quantum Q=2), Shortest Job First, and Priority Scheduling.</p>
      </section>

      <section>
        <h2>Memory Allocation Simulator</h2>
        <p>Dynamic contiguous memory partitioning simulator displaying memory fragmentation, hole reallocation, and address tracking across First Fit, Best Fit, and Worst Fit algorithms.</p>
      </section>

      <section>
        <h2>Graph Algorithm Visualizer</h2>
        <p>Step-by-step 2D grid pathfinding and node-link tree visualizers for Breadth-First Search (BFS), Depth-First Search (DFS), Dijkstra's Shortest Path, A* (A-Star) Search with Manhattan heuristics, Floyd-Warshall All-Pairs matrix DP, Kruskal's MST, Prim's MST, Topological Sort, and Disjoint Set Union (Union-Find / DSU).</p>
      </section>

      <section>
        <h2>Sorting Algorithm Visualizer</h2>
        <p>Visual comparative sorting laboratory for Quick Sort, Merge Sort, and Bubble Sort with real-time comparison counts, array swap highlights, and logarithmic Binary Search range pointers.</p>
      </section>

      <section>
        <h2>Dynamic Programming Visualizer</h2>
        <p>2D tableau matrix visualizers for 0/1 Knapsack Problem (include/exclude decision grid with subset traceback), Longest Common Subsequence (LCS), and Kadane's Linear Maximum Subarray Sum.</p>
      </section>

      <section>
        <h2>Array & String Techniques Visualizer</h2>
        <p>Interactive sliding window frame tracking, two-pointers inward convergence, Knuth-Morris-Pratt (KMP) pattern matching with precomputed LPS table, and Euclidean GCD modulo division.</p>
      </section>

      <section>
        <h2>Backtracking & Greedy Visualizer</h2>
        <p>N-Queens chessboard state space tree exploration with ray conflict pruning and Activity Selection interval scheduling.</p>
      </section>
